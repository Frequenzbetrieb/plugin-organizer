name: Build

on:
  push:
    branches: [main, "dev/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build app (native helpers + Electron, universal)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v5
        with:
          name: Frequenzbetrieb-Plugin-Organizer-macOS-universal
          path: |
            dist/Frequenzbetrieb-Plugin-Organizer-macOS-universal.dmg
            dist/Frequenzbetrieb-Plugin-Organizer-macOS-universal.zip

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build app (VST3 snapshot host + Electron)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Smoke test: photograph a real, free VST3 plugin (Surge XT) with the Windows host.
      - name: Test VST3 snapshot host (Surge XT)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/surge-synthesizer/releases-xt/releases/download/1.3.4/surge-xt-win64-1.3.4-pluginsonly.zip -OutFile surge.zip
          Expand-Archive surge.zip -DestinationPath surge
          New-Item -ItemType Directory -Force -Path snapshot-test | Out-Null
          $plugins = Get-ChildItem surge -Recurse | Where-Object { $_.Name -like '*.vst3' -and ($_.PSIsContainer -or $_.Extension -eq '.vst3') } | Where-Object { $_.FullName -notmatch '\\Contents\\' }
          $plugins | ForEach-Object { Write-Output "found: $($_.FullName)" }
          $jobs = @($plugins | ForEach-Object { @{ path = $_.FullName; out = (Join-Path (Resolve-Path snapshot-test) ($_.BaseName + '.png')) } })
          ConvertTo-Json -InputObject $jobs | Set-Content -Encoding utf8NoBOM jobs.json
          Get-Content jobs.json
          $proc = Start-Process -FilePath bin/vst3-snapshot.exe -RedirectStandardInput jobs.json -RedirectStandardOutput snapshot-test/result.txt -RedirectStandardError snapshot-test/stderr.txt -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(120000)) { $proc.Kill(); Write-Output "TIMEOUT" }
          Get-Content snapshot-test/result.txt
          Get-ChildItem snapshot-test

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Windows-VST3-snapshot-test
          path: snapshot-test/

      - uses: actions/upload-artifact@v5
        with:
          name: Frequenzbetrieb-Plugin-Organizer-Windows-x64
          path: |
            dist/Frequenzbetrieb-Plugin-Organizer-Windows-x64-Setup.exe
            dist/Frequenzbetrieb-Plugin-Organizer-Windows-x64.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
