<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Plugin laden</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 8px 10px; background: #2d2d2d; color: #d8d8d8; font: 12px -apple-system, "Segoe UI", sans-serif; }
    label { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
    .row { margin: 6px 0; }
    .lbl { color: #9a9a9a; font-size: 11px; margin-bottom: 3px; }
    select { width: 100%; box-sizing: border-box; background: #3d3d3d; color: #eee; border: 1px solid #555; border-radius: 3px; padding: 4px; font: inherit; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .filters .full { grid-column: 1 / -1; }
    .tag { font-size: 9px; font-weight: 700; padding: 0 4px; border-radius: 3px; background: #555; color: #fff; margin-left: 4px; vertical-align: 1px; }
    .tag.stock { background: #3b6e8f; } .tag.max { background: #7a5a9a; }
    #count { font-size: 11px; color: #9a9a9a; margin-top: 4px; }
    input[type=search] { width: 100%; box-sizing: border-box; background: #3d3d3d; color: #eee; border: 1px solid #555; border-radius: 3px; padding: 5px 6px; font: inherit; }
    #results { max-height: 220px; overflow-y: auto; border: 1px solid #444; border-radius: 3px; margin-top: 4px; }
    .item { padding: 5px 7px; cursor: pointer; border-bottom: 1px solid #383838; }
    .item:hover { background: #3f3f3f; }
    .item.sel { background: #ff5a2c; color: #111; }
    .item small { display: block; color: #9a9a9a; }
    .item.sel small { color: #331; }
    #chosen b { color: #fff; }
    #status { font-size: 11px; color: #9a9a9a; margin-top: 8px; }
    #status.err { color: #ff8a65; }
  </style>
</head>
<body>
  <div class="row">
    <div class="lbl">Plugin</div>
    <div id="chosen">Noch keins gewählt</div>
  </div>
  <div class="row filters">
    <div><div class="lbl">Typ</div><select id="type">
      <option value="">Alle</option><option value="Effect">Effekte</option><option value="Instrument">Instrumente</option><option value="MIDI FX">MIDI FX</option>
    </select></div>
    <div><div class="lbl">Quelle</div><select id="source">
      <option value="">Alle</option><option value="Plugin">Plugins</option><option value="Stock">Stock (Ableton)</option><option value="Max">Max for Live</option>
    </select></div>
    <div class="full"><div class="lbl">Kategorie</div><select id="category"><option value="">Alle Kategorien</option></select></div>
  </div>
  <div class="row">
    <input id="q" type="search" placeholder="Suchen – Name, Hersteller, Kategorie …" autocomplete="off" />
    <div id="count"></div>
    <div id="results"></div>
  </div>
  <label><input type="checkbox" id="newTrack" /> Auf neuer Spur laden</label>
  <label><input type="checkbox" id="showName" checked /> Name auf der Taste anzeigen</label>
  <div id="status"></div>

  <script>
    // Stream Deck property inspector protocol: the software calls connectElgatoStreamDeckSocket().
    let socket;
    let pendingCategory = '';
    let uuid;
    let action;
    let settings = {};
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function toPlugin(payload) { socket.send(JSON.stringify({ event: 'sendToPlugin', action, context: uuid, payload })); }
    function save() { socket.send(JSON.stringify({ event: 'setSettings', context: uuid, payload: settings })); }

    function showChosen() {
      $('#chosen').innerHTML = settings.pluginId
        ? `<b>${esc(settings.pluginName || '')}</b> <small>${esc(settings.pluginVendor || '')}</small>`
        : 'Noch keins gewählt – unten suchen und anklicken';
      $('#newTrack').checked = Boolean(settings.newTrack);
      $('#showName').checked = settings.showName !== false;
    }

    function showResults(list) {
      $('#results').innerHTML = list.map((p) => `<div class="item${p.id === settings.pluginId ? ' sel' : ''}" data-id="${esc(p.id)}">${esc(p.name)}${p.source === 'Stock' ? '<span class="tag stock">STOCK</span>' : p.source === 'Max' ? '<span class="tag max">MAX</span>' : ''}<small>${esc(p.vendor)} · ${esc(p.sub && p.sub !== p.category ? p.sub : p.category)}</small></div>`).join('')
        || '<div class="item"><small>Nichts gefunden.</small></div>';
      $('#results').querySelectorAll('[data-id]').forEach((el) => {
        el.onclick = () => {
          const p = list.find((x) => x.id === el.dataset.id);
          settings = { ...settings, pluginId: p.id, pluginName: p.name, pluginVendor: p.vendor };
          save();
          showChosen();
          showResults(list);
        };
      });
    }

    // Current filters (remembered per key in its settings).
    const filters = () => ({ q: $('#q').value, type: $('#type').value, source: $('#source').value, category: $('#category').value });
    function search() { toPlugin({ event: 'search', ...filters() }); }
    function refreshCategories() { toPlugin({ event: 'facets', ...filters(), category: '', q: '' }); }
    function rememberFilters() { settings.filter = { type: $('#type').value, source: $('#source').value, category: $('#category').value }; save(); }
    let timer;
    $('#q').oninput = () => { clearTimeout(timer); timer = setTimeout(search, 200); };
    $('#type').onchange = () => { $('#category').value = ''; rememberFilters(); refreshCategories(); search(); };
    $('#source').onchange = () => { $('#category').value = ''; rememberFilters(); refreshCategories(); search(); };
    $('#category').onchange = () => { rememberFilters(); search(); };
    let lastTotal = 0;
    $('#newTrack').onchange = (e) => { settings.newTrack = e.target.checked; save(); };
    $('#showName').onchange = (e) => { settings.showName = e.target.checked; save(); };

    function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
      uuid = inUUID;
      const info = JSON.parse(inActionInfo || '{}');
      action = info.action;
      settings = info.payload?.settings || {};
      socket = new WebSocket(`ws://127.0.0.1:${inPort}`);
      socket.onopen = () => {
        socket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
        showChosen();
        const f = settings.filter || {};
        $('#type').value = f.type || '';
        $('#source').value = f.source || '';
        toPlugin({ event: 'status' });
        refreshCategories();
        pendingCategory = f.category || '';
        search();
      };
      socket.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.event !== 'sendToPropertyInspector') return;
        const p = msg.payload;
        if (p.event === 'results') {
          showResults(p.plugins);
          $('#count').textContent = p.total > p.plugins.length ? `${p.plugins.length} von ${p.total} – Suche oder Kategorie eingrenzen` : `${p.total} Einträge`;
        }
        if (p.event === 'facets') {
          const sel = $('#category');
          const keep = pendingCategory || sel.value;
          sel.innerHTML = `<option value="">Alle Kategorien (${p.total})</option>` + p.categories.map((c) => `<option value="${esc(c.name)}">${esc(c.name)} (${c.count})</option>`).join('');
          if (keep && p.categories.some((c) => c.name === keep)) sel.value = keep;
          if (pendingCategory) { pendingCategory = ''; search(); }
        }
        if (p.event === 'status' || p.offline) {
          const st = $('#status');
          st.className = p.offline ? 'err' : '';
          st.textContent = p.offline
            ? 'Plugin Organizer nicht erreichbar – bitte die App starten (ab Version 0.3.0).'
            : `Plugin Organizer ${p.version || ''} verbunden · Ableton Live ${p.live ? 'läuft' : 'nicht gestartet'}`;
        }
      };
    }
  </script>
</body>
</html>
